name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Astral.sln

      - name: Build
        run: dotnet build Astral.sln -c Release --no-restore

      - name: Test
        run: dotnet test Astral.sln -c Release --no-build --no-restore
