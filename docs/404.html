<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080b">
<title>Not found — Astral</title>
<!-- Deliberately self-contained: GitHub Pages serves this file for any depth
     under the site root, so relative asset paths would resolve differently on
     every URL. No external CSS, no images. -->
<style>
  *, *::before, *::after { box-sizing: border-box }
  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    margin: 0;
    padding: 1.5rem;
    background: linear-gradient(180deg, #07080b, #0d0f14 60%, #101219);
    color: #f1f2f6;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    text-align: center;
  }
  .card {
    position: relative;
    max-width: 30rem;
    padding: clamp(1.75rem, 6vw, 3rem);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px;
    background: rgba(255,255,255,.045);
    box-shadow: 0 18px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.42);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    overflow: hidden;
  }
  .glow {
    position: absolute;
    inset: -40% -20% auto;
    height: 16rem;
    background: radial-gradient(50% 50% at 50% 50%, rgba(91,181,255,.28), transparent 70%);
    filter: blur(40px);
    pointer-events: none;
  }
  .code {
    margin: 0 0 .35rem;
    font-size: clamp(3.5rem, 16vw, 5.5rem);
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: 1;
    background: linear-gradient(180deg, #fff, #5bb5ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  h1 { margin: 0 0 .6rem; font-size: 1.35rem; font-weight: 650; letter-spacing: -.03em }
  p { margin: 0 0 1.75rem; color: #9aa1b0; font-size: .95rem }
  a {
    display: inline-flex;
    padding: .8rem 1.4rem;
    border-radius: 999px;
    background: linear-gradient(180deg, #fff, #dcdfe8);
    color: #08090b;
    font-weight: 650;
    text-decoration: none;
    transition: transform 260ms cubic-bezier(.16,1,.3,1);
  }
  a:hover { transform: translateY(-2px) }
  a:focus-visible { outline: 2px solid #9fd2ff; outline-offset: 3px }
  @media (prefers-reduced-motion: reduce) { a { transition: none } }
</style>
</head>
<body>
  <main class="card">
    <span class="glow" aria-hidden="true"></span>
    <p class="code">404</p>
    <h1>Nothing locked in here.</h1>
    <p>That page doesn't exist. The agent grid is back on the home page.</p>
    <a href="https://crzx1337.github.io/Astral-ValoTool/">Back to Astral</a>
  </main>
</body>
</html>
